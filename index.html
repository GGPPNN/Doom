<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Choose a hosted Doom IWAD or select one from your device." />
    <meta name="theme-color" content="#111111" />
    <title>DOOM — IWAD Launcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="launcher">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Doom launcher home">DOOM<span>/</span></a>
        <span class="topbar-note">BROWSER IWAD LAUNCHER</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">YOUR GAME, YOUR WAY</p>
        <h1 id="page-title">Choose an IWAD</h1>
        <p class="intro-copy">Select a game hosted here, or use an IWAD from your device.</p>
      </section>

      <section class="library-section" aria-labelledby="library-title">
        <div class="section-heading">
          <h2 id="library-title">Available here</h2>
          <span id="libraryCount" class="count">Loading…</span>
        </div>
        <div id="libraryGrid" class="wad-list" aria-live="polite"></div>
      </section>

      <section class="upload-section" aria-labelledby="upload-title">
        <div>
          <h2 id="upload-title">Use your own IWAD</h2>
          <p>Choose a .wad file on your device. It stays in this browser session.</p>
        </div>
        <label class="button secondary" for="wadInput">Choose IWAD</label>
        <input id="wadInput" type="file" accept=".wad,application/octet-stream" hidden />
      </section>

      <footer class="launch-bar">
        <div class="selection" aria-live="polite">
          <span class="selection-label">SELECTED</span>
          <strong id="selectedName">Nothing selected</strong>
        </div>
        <button id="launchBtn" class="button primary" type="button" disabled>Launch</button>
      </footer>
      <p id="statusMessage" class="status-message" role="status">Choose an IWAD to continue.</p>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
